    <style id="mobile-hero-tune">
      @media (max-width: 820px) {
        .brand .reg { display: none; }
        .brand { font-size: 18px; }
        .lang-switch { border: 0; }
        .lang-switch a:not(.on) { display: none; }
        .lang-switch a.on { padding: 7px 11px; font-size: 10px; letter-spacing: .08em; }
        .hero-content { padding-bottom: 30px; }
        .hero-content .kicker { font-size: 8px; letter-spacing: .12em; margin-bottom: 8px; white-space: nowrap; }
        .hero-content h1.display {
          font-size: 33px !important;
          line-height: 1.0 !important;
          margin-top: 10px !important;
          max-width: 18ch !important;
          letter-spacing: -.015em;
        }
        .hero-content p:not(.kicker) {
          font-size: 13px !important;
          line-height: 1.45 !important;
          max-width: 34ch;
          margin-top: 12px !important;
          display: -webkit-box;
          -webkit-line-clamp: 3;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }
        .hero-actions { margin-top: 14px !important; }
        .hero-actions > *:nth-child(2) { display: none !important; }
      }
    </style>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        var MQ = window.matchMedia('(max-width: 820px)');
        var MOBILE = '/images/hero-mobile.jpg';
        var DESKTOP = '/images/hero.jpg';
        function swap() {
          var img = document.querySelector('.hero-media img');
          if (!img) return;
          var want = MQ.matches ? MOBILE : DESKTOP;
          if (img.getAttribute('src') !== want) {
            img.setAttribute('src', want);
            img.style.opacity = '1';
          }
          var lede = document.querySelector('.hero-content p:not(.kicker)');
          if (lede && MQ.matches && !lede.dataset.trimmed) {
            var t = (lede.textContent || '').trim();
            var m = t.match(/^[^.]{40,}\./);
            if (m) { lede.textContent = m[0]; }
            lede.dataset.trimmed = '1';
          }
        }
        function boot() {
          swap();
          var root = document.getElementById('root');
          if (root) {
            var mo = new MutationObserver(swap);
            mo.observe(root, { childList: true, subtree: true });
            setTimeout(function () { mo.disconnect(); }, 8000);
          }
          MQ.addEventListener('change', swap);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
        else boot();
      })();
    </script>
  </body>
